<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Imagine - Puter MVP</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Inter', system-ui;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input,
        select,
        button,
        textarea {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:disabled {
            opacity: 0.5;
        }

        #preview {
            width: 100%;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
        }

        #result {
            width: 100%;
            border-radius: 12px;
            margin-top: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .loader {
            display: none;
            color: var(--accent);
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Grok Image Generator</h2>

        <textarea id="prompt" rows="3" placeholder="A futuristic digital character named Lizel..."></textarea>

        <div>
            <label>AI Model:</label><br>
            <select id="modelSelect">
                <!-- xAI -->
                <optgroup label="xAI (Grok)">
                    <option value="x-ai:grok-2-image" selected>Grok 2 Image</option>
                </optgroup>

                <!-- Google -->
                <optgroup label="Google">
                    <option value="google:google/gemini-2.5-flash-image">Gemini 2.5 Flash Image</option>
                    <option value="google:google/gemini-3-pro-image-preview">Gemini 3 Pro Image Preview</option>
                    <option value="google:google/gemini-3.1-flash-image-preview">Gemini 3.1 Flash Image Preview</option>
                    <option value="google:google/imagen-4.0">Imagen 4.0</option>
                    <option value="google:google/imagen-4.0-fast">Imagen 4.0 Fast</option>
                    <option value="google:google/imagen-4.0-ultra">Imagen 4.0 Ultra</option>
                </optgroup>

                <!-- OpenAI -->
                <optgroup label="OpenAI">
                    <option value="openai:openai/dall-e-2">DALL-E 2</option>
                    <option value="openai:openai/dall-e-3">DALL-E 3</option>
                    <option value="openai:openai/gpt-image-1">GPT-Image-1</option>
                    <option value="openai:openai/gpt-image-1-mini">GPT-Image-1 Mini</option>
                    <option value="openai:openai/gpt-image-1.5">GPT-Image-1.5</option>
                    <option value="openai:openai/gpt-image-2">GPT-Image-2</option>
                </optgroup>

                <!-- Replicate -->
                <optgroup label="Replicate">
                    <option value="replicate:black-forest-labs/flux-1.1-pro">Flux 1.1 Pro (Replicate)</option>
                    <option value="replicate:black-forest-labs/flux-2-dev">Flux 2 Dev (Replicate)</option>
                    <option value="replicate:black-forest-labs/flux-2-klein-4b">Flux 2 Klein 4B (Replicate)</option>
                    <option value="replicate:black-forest-labs/flux-2-klein-9b-base">Flux 2 Klein 9B Base (Replicate)</option>
                    <option value="replicate:black-forest-labs/flux-2-pro">Flux 2 Pro (Replicate)</option>
                    <option value="replicate:black-forest-labs/flux-schnell">Flux Schnell (Replicate)</option>
                    <option value="replicate:leonardoai/lucid-origin">Leonardo Lucid Origin</option>
                    <option value="replicate:leonardoai/phoenix-1.0">Leonardo Phoenix 1.0</option>
                </optgroup>

                <!-- Workers AI -->
                <optgroup label="Workers AI">
                    <option value="workers-ai:black-forest-labs/flux.1-schnell">Flux.1 Schnell (Workers AI)</option>
                    <option value="workers-ai:black-forest-labs/flux.2-dev">Flux.2 Dev (Workers AI)</option>
                    <option value="workers-ai:black-forest-labs/flux.2-klein-4b">Flux.2 Klein 4B (Workers AI)</option>
                    <option value="workers-ai:black-forest-labs/flux.2-klein-9b">Flux.2 Klein 9B (Workers AI)</option>
                    <option value="workers-ai:leonardo/lucid-origin">Leonardo Lucid Origin (Workers AI)</option>
                    <option value="workers-ai:leonardo/phoenix-1.0">Leonardo Phoenix 1.0 (Workers AI)</option>
                </optgroup>

                <!-- Together AI -->
                <optgroup label="Together AI">
                    <option value="togetherai:stabilityai/stable-diffusion-3-medium">Stable Diffusion 3 Medium</option>
                    <option value="togetherai:stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL Base 1.0</option>
                    <option value="togetherai:black-forest-labs/flux.1-schnell">Flux.1 Schnell</option>
                    <option value="togetherai:black-forest-labs/flux.1.1-pro">Flux.1.1 Pro</option>
                    <option value="togetherai:black-forest-labs/flux.2-pro">Flux.2 Pro</option>
                    <option value="togetherai:ideogram/ideogram-3.0">Ideogram 3.0</option>
                    <option value="togetherai:lykon/dreamshaper">Dreamshaper</option>
                    <option value="togetherai:wan-ai/wan2.6-image">Wan2.6 Image</option>
                    <option value="togetherai:qwen/qwen-image-2.0-pro">Qwen Image 2.0 Pro</option>
                    <!-- other togetherai models can be added dynamically, these are the top highlights -->
                </optgroup>
            </select>
        </div>

        <div>
            <label>Aspect Ratio:</label><br>
            <select id="aspectRatio">
                <option value="1:1" selected>1:1 (Square)</option>
                <option value="16:9">16:9 (Landscape)</option>
                <option value="9:16">9:16 (Portrait)</option>
                <option value="4:3">4:3 (Standard)</option>
                <option value="3:4">3:4 (Vertical)</option>
            </select>
        </div>

        <div>
            <label>Reference Image (Optional):</label><br>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <img id="preview" alt="Reference Preview">

        <button id="genBtn">Generate Image</button>

        <div id="status" class="loader">Grok is thinking...</div>
        <div id="resultContainer"></div>
    </div>

    <script>
        const genBtn = document.getElementById('genBtn');
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        let base64Image = null;

        // 1. Handle Image Upload & Preview
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    base64Image = event.target.result;
                    preview.src = base64Image;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. Main Generation Function
        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const aspectRatio = document.getElementById('aspectRatio').value;
            const modelName = document.getElementById('modelSelect').value;
            const status = document.getElementById('status');
            const resultContainer = document.getElementById('resultContainer');

            if (!prompt) {
                alert("Please provide a prompt.");
                return;
            }

            genBtn.disabled = true;
            status.style.display = 'block';
            resultContainer.innerHTML = '';

            try {
                // Parse the provider:model format
                let providerVal = null;
                let modelVal = modelName;
                if (modelName.includes(':')) {
                    const parts = modelName.split(':');
                    providerVal = parts[0];
                    // Map x-ai provider specifically to what the puter JS SDK grok docs mention ('xai')
                    if (providerVal === 'x-ai') providerVal = 'xai';
                    
                    modelVal = parts.slice(1).join(':'); // e.g. "x-ai/grok-2-image" or "grok-2-image"
                }

                // Define options for Puter's txt2img using the single-object structure defined in the Grok tutorial
                const apiArgs = {
                    prompt: prompt,
                    model: modelVal,
                    aspectRatio: aspectRatio
                };
                
                if (providerVal) {
                    apiArgs.provider = providerVal;
                }

                // If reference image provided, pass it along using input_image
                if (base64Image) {
                    apiArgs.input_image = base64Image;
                }

                // Use Puter's built-in AI proxy client with the full signature
                const imageElement = await puter.ai.txt2img(apiArgs);

                // Add the result safely
                imageElement.id = 'result';
                resultContainer.appendChild(imageElement);

            } catch (err) {
                console.error("Image generation error:", err);
                let errorMessage = "Unknown error";
                if (typeof err === "string") {
                    errorMessage = err;
                } else if (err instanceof Error) {
                    errorMessage = err.message;
                } else if (typeof err === "object") {
                    let innerErr = err.error || err;
                    errorMessage = typeof innerErr === "string" ? innerErr : (innerErr.message || JSON.stringify(innerErr));
                }
                alert("Error: " + errorMessage);
            } finally {
                genBtn.disabled = false;
                status.style.display = 'none';
            }
        }

        genBtn.onclick = generate;
    </script>

</body>

</html>
